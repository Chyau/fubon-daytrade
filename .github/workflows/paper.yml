name: paper-intraday

# 模擬下單：yfinance 5 分K 重放（與富邦引擎相同參數）
# 台灣時段 09:00–13:30 → UTC 01:00–05:30（yf 延遲 ~20 分，最後 13:50 收尾補抓）
# 狀態：data/trades.db 直接 commit 回 repo（每次重放 is_dup 去重，單寫入者）

on:
  schedule:
    # 可靠性設計：一天只需「一次」排程成功 — job 內建全日迴圈（每 15 分重放至台灣 14:05）
    - cron: "4 1 * * 1-5"     # 台灣 09:04（主線）
    - cron: "11 1 * * 1-5"    # 台灣 09:11（冗餘 1）
    - cron: "26 1 * * 1-5"    # 台灣 09:26（冗餘 2）
    - cron: "43 6 * * 1-5"    # 台灣 14:43 收盤終極補抓（第 4 次獨立機會）
  workflow_dispatch:
    inputs:
      symbols:
        description: "自訂標的（逗號分隔，如 2330,2426；留空 = 多空 24 檔重放）"
        required: false
        default: ""
      period:
        description: "yfinance 期數（5d/10d/1mo/60d）"
        required: false
        default: "5d"
      risk_budget:
        description: "單筆風險預算（元，0 = 固定 1 張）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-24.04
    timeout-minutes: 330   # 全日迴圈 09:04→14:05 台灣（5 小時）
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Git identity（commit 需要）
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: 迴圈去重（10 分鐘內已有 paper-bot 活動 → 跳過冗餘觸發）
        run: |
          LAST=$(git log -1 --format=%ct --author=paper-bot 2>/dev/null || echo 0)
          NOW=$(date +%s)
          AGE=$((NOW - LAST))
          echo "paper-bot 最後 commit 距今 ${AGE} 秒"
          if [ "$AGE" -lt 720 ]; then
            echo "另一個迴圈活躍中 — 跳過本次冗餘觸發"
            exit 0
          fi

      - name: Paper step（晨間觸發→全日迴圈；EOD 觸發→單次補抓）
        run: >
          python tools/paper_step.py --push
          --period "${{ inputs.period || '5d' }}"
          --symbols "${{ inputs.symbols }}"
          --risk-budget "${{ inputs.risk_budget || '0' }}"
          --loop-until "06:05"
        env:
          SNAPSHOT_PASSWORD: ${{ secrets.SNAPSHOT_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          echo "### 模擬下單步驟完成" >> $GITHUB_STEP_SUMMARY
          echo "- 時間：$(TZ=Asia/Taipei date '+%F %T')" >> $GITHUB_STEP_SUMMARY
          echo "- 快照：<https://fubon-daytrade-snapshot.vercel.app/>" >> $GITHUB_STEP_SUMMARY
