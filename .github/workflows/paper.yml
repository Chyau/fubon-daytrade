name: paper-intraday

# 模擬下單：yfinance 5 分K 重放（與富邦引擎相同參數）
# 台灣時段 09:00–13:30 → UTC 01:00–05:30（yf 延遲 ~20 分，最後 13:50 收尾補抓）
# 狀態：data/trades.db 直接 commit 回 repo（每次重放 is_dup 去重，單寫入者）

on:
  schedule:
    # 避開 :00/:15/:30/:45（GitHub 高負載時段易延遲/丟棄）→ 錯開分鐘＋雙冗餘
    - cron: "4,19,34,49 1-5 * * 1-5"    # 台灣 09:04–13:49 每 15 分（A 線）
    - cron: "11,26,41,56 1-5 * * 1-5"   # 台灣 09:11–13:56 每 15 分（B 線備援）
    - cron: "58 5 * * 1-5"              # 台灣 13:58 收盤收尾
    - cron: "43 6 * * 1-5"              # 台灣 14:43 終極補抓（yf 延遲 20 分＋排程延遲）
  workflow_dispatch:
    inputs:
      symbols:
        description: "自訂標的（逗號分隔，如 2330,2426；留空 = 多空 24 檔重放）"
        required: false
        default: ""
      period:
        description: "yfinance 期數（5d/10d/1mo/60d）"
        required: false
        default: "5d"
      risk_budget:
        description: "單筆風險預算（元，0 = 固定 1 張）"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: paper
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Git identity（commit 需要）
        run: |
          git config user.name "paper-bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Paper step（重放＋去重＋快照＋推送）
        run: >
          python tools/paper_step.py --push
          --period "${{ inputs.period || '5d' }}"
          --symbols "${{ inputs.symbols }}"
          --risk-budget "${{ inputs.risk_budget || '0' }}"
        env:
          SNAPSHOT_PASSWORD: ${{ secrets.SNAPSHOT_PASSWORD }}

      - name: Summary
        if: always()
        run: |
          echo "### 模擬下單步驟完成" >> $GITHUB_STEP_SUMMARY
          echo "- 時間：$(TZ=Asia/Taipei date '+%F %T')" >> $GITHUB_STEP_SUMMARY
          echo "- 快照：<https://fubon-daytrade-snapshot.vercel.app/>" >> $GITHUB_STEP_SUMMARY
